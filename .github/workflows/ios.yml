name: iOS

# A tag push publishes a release. Running the workflow manually, or pushing a
# commit whose message starts with BUILD_NOW, uploads the same IPA as a workflow
# artifact instead. Every other push stops at the gate below without building.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' ||
      (github.event.head_commit != null && startsWith(github.event.head_commit.message, 'BUILD_NOW'))
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install gomobile
        # The wrapper package lives under ios/, but gomobile resolves it against
        # the repo-root module, so these steps run from the repository root.
        working-directory: .
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
      - name: Build Mobile.xcframework
        working-directory: .
        run: ios/scripts/build_mobile.sh
      - name: Install XcodeGen
        uses: tecolicom/actions-use-homebrew-tools@v1
        with:
          tools: xcodegen
          cache: yes
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        # No signing identity is available on CI, so the app is built unsigned.
        # The resulting IPA can be sideloaded with AltStore/Sideloadly or signed
        # by the user before installing.
        run: |
          xcodebuild \
            -project WiiUDownloader.xcodeproj \
            -scheme WiiUDownloader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/WiiUDownloader.app"
          test -d "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry WiiUDownloader.ipa Payload
          ls -lh WiiUDownloader.ipa
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: WiiUDownloader-iOS
          path: ios/WiiUDownloader.ipa
          if-no-files-found: error
      - name: Upload IPA to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: True
          makeLatest: True
          omitBody: True
          omitBodyDuringUpdate: True
          omitNameDuringUpdate: True
          artifacts: "ios/WiiUDownloader.ipa"
          token: ${{ secrets.GITHUB_TOKEN }}
